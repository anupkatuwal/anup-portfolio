services:
  - type: web
    name: anup-portfolio-backend
    runtime: python
    rootDir: anup_portfolio_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/portfolio.db
    plan: free
