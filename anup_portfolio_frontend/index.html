<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: self-hosted (CSP font-src 'self'); only Inter Tight 600 is preloaded -->
    <link rel="preload" href="/fonts/inter-tight-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Primary SEO -->
    <title>Anup Katuwal — Backend Developer &amp; Data Analyst</title>
    <meta
      name="description"
      content="Backend developer moving into data analytics. Python, SQL, FastAPI and ML research. Based in Kathmandu, Nepal."
    />
    <meta name="author" content="Anup Katuwal" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0A0C09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8F3" media="(prefers-color-scheme: light)" />
    <!-- Blocking on purpose, and after theme-color: applies a saved theme
         before first paint so it never flashes. Tiny, same-origin. -->
    <script src="/theme-init.js"></script>
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Anup Katuwal" />
    <meta property="og:title" content="Anup Katuwal — Backend Developer &amp; Data Analyst" />
    <meta property="og:description" content="Python, SQL, FastAPI and ML research. Kathmandu, Nepal." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anup Katuwal — Backend Developer &amp; Data Analyst" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anup Katuwal — Backend Developer &amp; Data Analyst" />
    <meta name="twitter:description" content="Python, SQL, FastAPI and ML research. Kathmandu, Nepal." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="Anup Katuwal — Backend Developer &amp; Data Analyst" />

    <!-- Structured data: Person + WebSite + ProfilePage (linked @graph) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "@id": "%SITE_URL%/#webpage",
        "url": "%SITE_URL%/",
        "name": "Anup Katuwal — Backend Developer & Data Analyst",
        "description": "Portfolio of Anup Katuwal — backend developer moving into data analytics, Kathmandu, Nepal.",
        "inLanguage": "en",
        "isPartOf": {
          "@type": "WebSite",
          "@id": "%SITE_URL%/#website",
          "url": "%SITE_URL%/",
          "name": "Anup Katuwal",
          "inLanguage": "en"
        },
        "mainEntity": {
          "@type": "Person",
          "@id": "%SITE_URL%/#person",
          "name": "Anup Katuwal",
          "url": "%SITE_URL%/",
          "image": "%SITE_URL%/profile.jpg",
          "jobTitle": "Backend Developer & Data Analyst",
          "description": "Backend developer moving into data analytics, based in Kathmandu, Nepal. Python, SQL, FastAPI, and Master's thesis research on fairness in mental-health NLP.",
          "email": ["mailto:contact@anup-katuwal.com.np", "mailto:katuwalanup@gmail.com"],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Kathmandu",
            "addressCountry": "Nepal"
          },
          "alumniOf": [
            {
              "@type": "CollegeOrUniversity",
              "name": "Nepal College of Information Technology (NCIT), Pokhara University"
            },
            {
              "@type": "CollegeOrUniversity",
              "name": "Columbia College, Denver, Colorado"
            }
          ],
          "knowsAbout": [
            "Data Engineering",
            "ETL Pipelines",
            "Data Warehousing",
            "Star Schema",
            "Natural Language Processing",
            "Machine Learning",
            "Python",
            "SQL",
            "Pandas",
            "BERT",
            "FastAPI",
            "Fairness in AI"
          ],
          "sameAs": [
            "https://github.com/anupkatuwal",
            "https://www.linkedin.com/in/anupkatuwal1989",
            "https://www.upwork.com/freelancers/~01fe60c948627059d5"
          ]
        }
      }
    </script>

  </head>
  <body>
    <div id="root"><!--ssg--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
