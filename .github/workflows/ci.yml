name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: anup_portfolio_frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: anup_portfolio_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps + pytest
        working-directory: anup_portfolio_frontend/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run backend tests
        working-directory: anup_portfolio_frontend/api
        run: pytest -q
